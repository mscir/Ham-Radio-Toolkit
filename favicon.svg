<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Background (transparent) -->
  
  <!-- Radio body -->
  <rect x="6" y="14" width="52" height="36" rx="3" ry="3" fill="#1a1a1a" stroke="#333" stroke-width="1"/>
  
  <!-- Slight top bevel -->
  <rect x="6" y="14" width="52" height="4" rx="3" ry="3" fill="#2a2a2a"/>
  
  <!-- Large color display (IC-7300 style) -->
  <rect x="10" y="20" width="32" height="18" rx="1.5" fill="#0a2a1a" stroke="#00aa66" stroke-width="0.8"/>
  
  <!-- Screen content suggestion -->
  <rect x="12" y="22" width="28" height="3" rx="0.5" fill="#00cc77" opacity="0.7"/>
  <rect x="12" y="27" width="18" height="2" rx="0.5" fill="#00aa55" opacity="0.5"/>
  <rect x="12" y="31" width="22" height="2" rx="0.5" fill="#00aa55" opacity="0.4"/>
  
  <!-- Main VFO knob (right side) -->
  <circle cx="50" cy="32" r="7" fill="#222" stroke="#444" stroke-width="1"/>
  <circle cx="50" cy="32" r="4.5" fill="#111" stroke="#555" stroke-width="0.8"/>
  <circle cx="50" cy="32" r="1.5" fill="#666"/>
  
  <!-- Small function buttons under the screen -->
  <rect x="10" y="41" width="6" height="4" rx="0.8" fill="#333"/>
  <rect x="18" y="41" width="6" height="4" rx="0.8" fill="#333"/>
  <rect x="26" y="41" width="6" height="4" rx="0.8" fill="#333"/>
  <rect x="34" y="41" width="6" height="4" rx="0.8" fill="#333"/>
  
  <!-- Power / Multi knob hint -->
  <circle cx="50" cy="44" r="2.8" fill="#222" stroke="#444" stroke-width="0.7"/>
</svg>
